name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Checks
        run: |
          bun run lint
          bun run test
          bun run build

      - name: Package Release Bundle
        run: tar -czf vex-654-inventory-dist.tar.gz dist/ server.ts package.json .env.example CHANGELOG.md

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG_NAME" vex-654-inventory-dist.tar.gz \
            --title "VEX 654 Inventory $TAG_NAME" \
            --generate-notes
