name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-Check, Verify Suite, Build & Server Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Check
        run: bun run lint

      - name: Run Automated Verification Suite
        run: bun run test

      - name: Build Production + PWA Bundle
        run: |
          bun run build
          test -f dist/index.html

      - name: Check Express Server Bundle
        run: bun build server.ts --target=node --packages=external --outfile=/tmp/server-check.mjs && node --check /tmp/server-check.mjs
