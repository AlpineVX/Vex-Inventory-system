changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Features & Improvements
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Mobile & UI Polish
      labels:
        - mobile
        - ui
    - title: Google Sheets & Server
      labels:
        - sync
        - server
    - title: Dependencies & Maintenance
      labels:
        - dependencies
        - ci
        - documentation
    - title: Other Changes
      labels:
        - "*"
